# mes_server 레포 홈서버 이전 파일럿 — docker compose 스택 (OCI 배포 deploy.yml과 무관, 병행).
# 실행 위치: 이 파일이 있는 deploy/home/ 디렉터리 (.env는 같은 디렉터리에 둔다, .env.example 참고)
#
# 네트워크 구성:
#   - default(내부): app ↔ simulator 통신용 (simulator가 http://mes:8086 으로 app 호출)
#   - shared-net(외부, 사전 생성 필요: `docker network create shared-net`): app만 조인
#     — 호스트에 이미 떠 있는 db-mysql(MySQL 8, mes_db 스키마 복원됨)·db-redis(Redis 7,
#     requirepass) 컨테이너 접근용. 두 컨테이너도 shared-net에 조인돼 있어야 app이 붙을 수 있다
#     (README.md 체크리스트 참고 — 조인은 메타가 사전 처리).
#
# TLS/외부 노출은 이 스택에서 다루지 않는다 — 8086은 로컬 스모크(127.0.0.1)에만 publish한다.
# application-prod.yml은 무수정 — datasource URL·redis host/port·서버 포트는 전부
# env(Spring 상대 우선순위: OS 환경변수 > application-{profile}.yml)로 오버라이드한다.

# 프로젝트명 고정 — 실행 CWD·유저에 따라 프로젝트명이 달라져 같은 스택이 이중으로 뜨는 것을 방지
name: mes-home

networks:
  shared-net:
    external: true

services:
  # ⚠️ 서비스 키가 `app` 이 아닌 이유 (luma200ok/home-infra#15) — compose 는 서비스가 조인하는
  #    **모든** 네트워크에 **서비스 키를 별칭으로 게시**한다. 공유망 shared-net(홈서버 전 스택 공용)에
  #    `app` 같은 일반명을 올리면 같은 이름을 올린 다른 스택과 도커 DNS 가 라운드로빈한다.
  #    2026-08-23 실측에서 community·mes·pension·dopacheck 네 컨테이너가 동시에 `app` 을 게시하고
  #    있었고, 같은 구조의 `frontend` 충돌로 farm.luma200ok.com 이 실제로 502 가 났다.
  #    ⚠️ `aliases:` 로는 못 막는다 — 별칭은 대체가 아니라 **추가**라 서비스 키가 그대로 남는다(실측).
  #    컨테이너명(container_name)은 그대로라 터널 인그레스는 영향받지 않는다.
  mes-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mes
    restart: unless-stopped
    # 메모리 상한 — OOM killer는 원인 제공자가 아니라 그 순간 점수가 가장 높은 프로세스를 죽이므로,
    # 상한 없는 컨테이너의 폭주가 같은 호스트의 무관한 컨테이너를 죽일 수 있다(홈서버 24개 컨테이너 전수 상한 없음, 2026-08-23).
    # JAVA_OPTS(-Xmx512m)는 힙만 제한 — 실제 프로세스는 메타스페이스·코드 캐시·스레드 스택·다이렉트 버퍼·GC 구조를 추가로 쓴다.
    # 실측 RSS 655MiB(힙 512m 설정 시)가 그 차이를 보여줌 → 힙의 약 3배를 상한으로 설정.
    deploy:
      resources:
        limits:
          memory: 1.5G

    # 디스크 상한(luma200ok/home-infra#16) — 호스트에 /etc/docker/daemon.json 이 없어
    # json-file 이 **무제한**으로 쌓이는 상태다(2026-08-23 실측). restart: unless-stopped 와
    # 겹치면 크래시 루프가 루트 파티션을 채우고, 그때는 메모리 상한과 똑같이 무관한 스택까지
    # 동반 장애가 난다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xmx512m
      # application-prod.yml의 하드코딩된 localhost URL을 env 우선순위로 덮어씀(코드 무수정)
      SPRING_DATASOURCE_URL: jdbc:mysql://db-mysql:3306/mes_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      # application-prod.yml의 하드코딩된 spring.data.redis.host/port(localhost/6379)를 덮어씀
      SPRING_DATA_REDIS_HOST: db-redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 센서 수신 API 키 — 소스의 공개 기본값(mes-sensor-local-key) 의존 금지(리뷰 P2)
      MES_SENSOR_API_KEY: ${MES_SENSOR_API_KEY:?required}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: ${SPRING_DATA_REDIS_DATABASE}
    ports:
      # 홈서버 로컬 스모크 전용 바인딩 — 외부 노출 방식(리버스 프록시/터널)은 별도 PR에서 결정
      - "127.0.0.1:8086:8086"
    networks:
      - default
      - shared-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # simulator 는 default 네트워크에만 있어 공유망 충돌 대상이 아니다 — 키를 그대로 둔다.
  # 단 shared-net 에 조인하게 되면 반드시 `mes-simulator` 로 바꿀 것(home-infra#15).
  simulator:
    build:
      context: ../..
      dockerfile: deploy/home/Dockerfile.simulator
    container_name: mes-simulator
    restart: unless-stopped
    # 메모리 상한 — 실측 RSS 18MiB(경량 시뮬레이터)이지만 상한 자체를 두어 폭주 시
    # 무관한 컨테이너로 OOM 피해가 번지는 것을 차단(근거는 app 서비스 주석 참고).
    deploy:
      resources:
        limits:
          memory: 512M

    # 디스크 상한(luma200ok/home-infra#16) — 호스트에 /etc/docker/daemon.json 이 없어
    # json-file 이 **무제한**으로 쌓이는 상태다(2026-08-23 실측). restart: unless-stopped 와
    # 겹치면 크래시 루프가 루트 파티션을 채우고, 그때는 메모리 상한과 똑같이 무관한 스택까지
    # 동반 장애가 난다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MES_BASE_URL: http://mes:8086
      MES_SENSOR_API_KEY: ${MES_SENSOR_API_KEY:?required}
    networks:
      - default
    depends_on:
      mes-app:
        condition: service_healthy
