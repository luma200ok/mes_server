name: MES Server CI/CD

# OCI(B, oci-arm2) 배포 — systemd 서비스 방식 (mes.service, 포트 8086)
# 백엔드 jar + React(client/dist) 정적 + simulator 동시 배포.
# 시크릿은 서버의 /etc/app-secrets/mes.env 에 보관.

# [구 OCI 배포 — 2026-08-24 push 트리거 제거(#18)]
# mes 실서비스는 홈서버 도커(deploy-home.yml)로 이전했다. push 트리거를 남겨 두면 머지마다
# 아무도 안 쓰는 oci-arm2 에 배포가 돌고(현재 mes.service 는 failed), 성공하면 죽은 인스턴스가
# 되살아나 같은 도메인·같은 DB 를 두 곳에서 물게 된다.
# OCI 해지 전까지 수동 롤백 경로로 workflow_dispatch 만 남긴다.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 3. 백엔드 테스트
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: 3-1. 백엔드 빌드
        run: ./gradlew bootJar -x test

      - name: 4. Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 5. React 빌드
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: 6. jar 업로드 (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*SNAPSHOT.jar"
          target: "/home/opc/apps/mes/staging"
          strip_components: 2
          rm: true

      - name: 7. React dist 업로드 (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "client/dist/**"
          target: "/home/opc/mes-client-staging"
          strip_components: 2
          rm: true

      - name: 8. simulator 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "simulator/simulate.py"
          target: "/home/opc/apps/mes"
          strip_components: 1

      - name: 9. 배포 + 재시작 + 헬스체크
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            APP=mes; PORT=8086
            # 백엔드 jar 교체
            JAR=$(ls /home/opc/apps/$APP/staging/*.jar | grep -v plain | head -1)
            echo "> 배포 jar: $JAR"
            cp "$JAR" /home/opc/apps/$APP/$APP.jar
            rm -rf /home/opc/apps/$APP/staging
            # React 정적 교체
            sudo rm -rf /var/www/mes-client
            sudo mkdir -p /var/www/mes-client
            sudo cp -r /home/opc/mes-client-staging/* /var/www/mes-client/
            sudo chmod -R a+rX /var/www/mes-client
            sudo chcon -R -t httpd_sys_content_t /var/www/mes-client 2>/dev/null || sudo restorecon -R /var/www/mes-client
            rm -rf /home/opc/mes-client-staging
            echo "> React 정적 배포 완료"
            # 백엔드 재시작 + 헬스체크
            sudo systemctl restart $APP
            echo "> 백엔드 재시작, 헬스체크..."
            UP=0
            for i in $(seq 1 18); do
              sleep 5
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT/actuator/health 2>/dev/null || echo 000)
              if [ "$CODE" = "200" ]; then echo "> ✅ $APP 정상 (HTTP $CODE)"; UP=1; break; fi
              echo "> 시도 $i/18 (HTTP $CODE)..."
            done
            if [ "$UP" != "1" ]; then echo "> ❌ $APP 기동 실패"; sudo journalctl -u $APP -n 40 --no-pager; exit 1; fi
            # 시뮬레이터 재시작 (systemd 유닛은 서버에 이미 등록됨)
            sudo systemctl restart mes-simulator || true
            echo "> 🎉 mes 배포 완료"
